<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার গেমিং পোর্টাল</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f4; }
        .container { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 5px; }
        .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .game-card { border: 1px solid #ddd; padding: 10px; border-radius: 8px; }
        .wallet-actions { margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>আমার গেমিং পোর্টাল</h1>

    <div id="auth-container">
        <input type="email" id="email" placeholder="ইমেইল"><br>
        <input type="password" id="password" placeholder="পাসওয়ার্ড"><br>
        <button onclick="signUp()">সাইনআপ</button>
        <button onclick="logIn()">লগইন</button>
    </div>

    <div id="profile-section" style="display:none;">
        <div id="profile-info"></div>
        
        <div class="wallet-actions">
            <button onclick="handleTransaction('ডিপোজিট')">ডিপোজিট</button>
            <button onclick="handleTransaction('উইথড্র')">উইথড্র</button>
        </div>
        
        <button onclick="logOut()">লগআউট</button>

        <div class="game-grid">
            <div class="game-card">
                <p>Super Ace</p>
                <button onclick="playGame('Super Ace')">Play</button>
            </div>
            <div class="game-card">
                <p>Fortune Gems</p>
                <button onclick="playGame('Fortune Gems')">Play</button>
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAmmkzOVL03j4G-R1sU-Rs-zVXFHvSRvz8",
        authDomain: "my-new-project-39095.firebaseapp.com",
        projectId: "my-new-project-39095",
        storageBucket: "my-new-project-39095.firebasestorage.app",
        messagingSenderId: "201479161493",
        appId: "1:201479161493:web:257e6c0d130390f7033d9c"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function signUp() { auth.createUserWithEmailAndPassword(document.getElementById('email').value, document.getElementById('password').value).catch(e => alert(e.message)); }
    function logIn() { auth.signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('password').value).catch(e => alert(e.message)); }
    function logOut() { auth.signOut().then(() => location.reload()); }

    // ডিপোজিট এবং উইথড্র রিকোয়েস্ট সিস্টেম
    function handleTransaction(type) {
        let amount = prompt(type + " করতে কত টাকা চান?");
        if (amount) {
            alert(type + " রিকোয়েস্ট পাঠানো হয়েছে: " + amount + " টাকা। এডমিন যাচাই করে ব্যালেন্স আপডেট করবেন।");
            // ডাটাবেসে রিকোয়েস্টটি সেভ করার জন্য এখানে Firestore কোড যুক্ত করতে হবে
        }
    }

    // গেম খেলার ফাংশন
    function playGame(name) {
        alert(name + " গেমটি চালু হচ্ছে... আপনার গেমিং আনন্দ উপভোগ করুন!");
        // এখানে নির্দিষ্ট গেমের URL রিডাইরেক্ট কোড যুক্ত করা যাবে
    }

    auth.onAuthStateChanged((user) => {
        if (user) {
            document.getElementById("auth-container").style.display = "none";
            document.getElementById("profile-section").style.display = "block";
            db.collection("users").doc(user.uid).get().then((doc) => {
                if (doc.exists) {
                    document.getElementById("profile-info").innerHTML = `ইমেইল: ${user.email} <br> <b>ব্যালেন্স: ${doc.data().balance} TK</b>`;
                }
            });
        }
    });
</script>
</body>
</html>

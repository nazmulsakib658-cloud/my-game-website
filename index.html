<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Portal</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding-bottom: 70px; }
        .header { background: #e91e63; color: white; padding: 15px; text-align: center; }
        .balance-card { background: white; margin: 15px; padding: 20px; border-radius: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 15px; }
        .menu-item { background: white; padding: 15px; text-align: center; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #ddd; }
        button { background: #e91e63; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin: 5px; }
        #auth-container { padding: 40px; text-align: center; }
    </style>
</head>
<body>

<div id="auth-container">
    <h2>Login to Portal</h2>
    <input type="email" id="email" placeholder="Email"><br>
    <input type="password" id="password" placeholder="Password"><br>
    <button onclick="logIn()">Login</button>
</div>

<div id="main-content" style="display:none;">
    <div class="header"><h3>Gaming Portal</h3></div>
    <div class="balance-card">
        <p>Total Balance</p>
        <h2 id="display-balance">৳ 0.00</h2>
        <button onclick="handleTransaction('Deposit')">Deposit</button>
        <button onclick="handleTransaction('Withdraw')">Withdraw</button>
    </div>

    <div class="grid-menu">
        <div class="menu-item" onclick="playGame('Slots')">🎰 Slots</div>
        <div class="menu-item" onclick="playGame('Fishing')">🦈 Fishing</div>
        <div class="menu-item" onclick="playGame('Sports')">⚽ Sports</div>
    </div>

    <div class="nav-bar">
        <div>🏠 Home</div>
        <div>📊 Activity</div>
        <div onclick="logOut()">👤 Logout</div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAmmkzOVL03j4G-R1sU-Rs-zVXFHvSRvz8",
        authDomain: "my-new-project-39095.firebaseapp.com",
        projectId: "my-new-project-39095",
        storageBucket: "my-new-project-39095.firebasestorage.app",
        messagingSenderId: "201479161493",
        appId: "1:201479161493:web:257e6c0d130390f7033d9c"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function logIn() { auth.signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('password').value).catch(e => alert(e.message)); }
    function logOut() { auth.signOut().then(() => location.reload()); }
    function handleTransaction(type) { prompt(type + " Amount:"); }
    function playGame(name) { alert("Loading " + name + "..."); }

    auth.onAuthStateChanged((user) => {
        if (user) {
            document.getElementById("auth-container").style.display = "none";
            document.getElementById("main-content").style.display = "block";
            db.collection("users").doc(user.uid).get().then((doc) => {
                if (doc.exists) document.getElementById("display-balance").innerText = "৳ " + doc.data().balance;
            });
        }
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HGNICE Gaming Portal</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding-bottom: 80px; }
        .header { background: #e91e63; color: white; padding: 15px; text-align: center; }
        .balance-card { background: white; margin: 15px; padding: 20px; border-radius: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .payment-box { margin-top: 15px; }
        select, input { padding: 8px; width: 80%; margin: 5px; }
        button { background: #e91e63; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #ddd; }
    </style>
</head>
<body>

<div class="header"><h3>HGNICE পোর্টাল</h3></div>

<div class="balance-card">
    <p>ব্যালেন্স</p>
    <h2>৳ <span id="display-balance">40</span></h2>
    
    <div class="payment-box">
        <h4>পেমেন্ট মেথড নির্বাচন করুন</h4>
        <select id="method">
            <option value="bKash">বিকাশ (bKash)</option>
            <option value="Nagad">নগদ (Nagad)</option>
            <option value="USDT">USDT (TRC20)</option>
        </select><br>
        <input type="number" id="amount" placeholder="পরিমাণ লিখুন (টাকা/USDT)">
        <br>
        <button onclick="processTransaction('Deposit')">ডিপোজিট</button>
        <button onclick="processTransaction('Withdraw')" style="background:#555;">উইথড্র</button>
    </div>
</div>

<div class="nav-bar">
    <div>🏠 হোম</div>
    <div>📊 অ্যাক্টিভিটি</div>
    <div>👤 অ্যাকাউন্ট</div>
</div>

<script>
    function processTransaction(type) {
        const method = document.getElementById('method').value;
        const amount = document.getElementById('amount').value;
        
        if(!amount) {
            alert("অনুগ্রহ করে সঠিক পরিমাণ লিখুন!");
            return;
        }
        
        alert(type + " রিকোয়েস্ট সফলভাবে পাঠানো হয়েছে!\nমেথড: " + method + "\nপরিমাণ: " + amount + "\nএডমিন শীঘ্রই চেক করবেন।");
    }
</script>

</body>
</html>

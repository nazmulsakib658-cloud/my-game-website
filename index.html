<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>আমার গেমিং পোর্টাল</title>
    <style>
        body { font-family: sans-serif; background-color: #222; color: white; text-align: center; padding: 50px; }
        .game-box { border: 2px solid #fff; padding: 20px; display: inline-block; border-radius: 10px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>আমার গেমিং পোর্টাল</h1>
    <div class="game-box">
        <p>এখানে আপনার গেমটি খেলুন!</p>
        <button onclick="alert('গেম শুরু হচ্ছে!')">গেমটি শুরু করুন</button>
    </div>
</body>
</html>

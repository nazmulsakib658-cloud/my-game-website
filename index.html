<button onclick="saveScore()">স্কোর সেভ করুন</button>

<script>
    async function saveScore() {
        // নিচের লিঙ্কটিতে আপনার MongoDB Atlas-এর Data API Endpoint বসান
        const url = "https://ap-south-1.aws.data.mongodb-api.com/app/your-app-id/endpoint/data/v1/action/insertOne";
        const apiKey = "আপনার-API-KEY-এখানে-বসানো";

        const response = await fetch(url, {
            method: "POST",
            headers: {
                "api-key": apiKey,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                "dataSource": "Cluster0", // আপনার ক্লাস্টারের নাম
                "database": "game_db",
                "collection": "scores",
                "document": { "score": 100, "date": new Date() }
            })
        });

        const result = await response.json();
        alert("ডাটাবেসের উত্তর: " + JSON.stringify(result));
    }
</script>

<html lang="bn">
<head>

    <title>গেমিং পোর্টাল</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        .game-card { border: 1px solid #ccc; padding: 10px; margin: 10px; border-radius: 8px; }

        <button onclick="saveScore()">স্কোর সেভ করুন (+10)</button>
        <button onclick="logOut()">লগআউট</button>

        <div class="game-card">
            <p>Super Ace</p>
            <button onclick="playGame('Super Ace')">Play</button>
        </div>
        <div class="game-card">
            <p>Fortune Gems</p>
            <button onclick="playGame('Fortune Gems')">Play</button>
        </div>
    </div>

</body>
</html>

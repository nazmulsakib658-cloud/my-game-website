<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার গেমিং পোর্টাল</title>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        button { padding: 10px 20px; margin: 10px; cursor: pointer; }
        #profile-section { margin-top: 20px; border: 1px solid #ccc; padding: 20px; display: none; }
    </style>
</head>
<body>

    <h1>আমার গেমিং পোর্টাল</h1>

    <div id="auth-container">
        <input type="email" id="email" placeholder="ইমেইল">
        <input type="password" id="password" placeholder="পাসওয়ার্ড">
        <br>
        <button onclick="signUp()">সাইনআপ</button>
        <button onclick="logIn()">লগইন</button>
    </div>

    <div id="profile-section">
        <h3>আপনার প্রোফাইল</h3>
        <div id="profile-info"></div>
        <button onclick="saveScore()">স্কোর সেভ করুন</button>
        <button onclick="logOut()">লগআউট</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAmmkzOVL03j4G-R1sU-Rs-zVXFHvSRvz8",
            authDomain: "my-new-project-39095.firebaseapp.com",
            projectId: "my-new-project-39095",
            storageBucket: ""my-new-project-39095.firebasestorage.app",
            messagingSenderId: "201479161493",
            appId: "1:201479161493:web:257e6c0d130390f7033d9c",
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // সাইনআপ
        function signUp() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            auth.createUserWithEmailAndPassword(email, pass)
                .then(() => alert("সাইনআপ সফল!"))
                .catch(e => alert("এরর: " + e.message));
        }

        // লগইন
        function logIn() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            auth.signInWithEmailAndPassword(email, pass)
                .then(() => alert("লগইন সফল!"))
                .catch(e => alert("এরর: " + e.message));
        }

        // লগআউট
        function logOut() {
            auth.signOut().then(() => location.reload());
        }

        // স্কোর সেভ
        function saveScore() {
            const user = auth.currentUser;
            if(user) {
                db.collection("users").doc(user.uid).update({
                    balance: firebase.firestore.FieldValue.increment(10) // ১০ পয়েন্ট যোগ হবে
                }).then(() => alert("স্কোর সেভ হয়েছে!"));
            }
        }

        // ইউজার চেক
        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById("auth-container").style.display = "none";
                document.getElementById("profile-section").style.display = "block";
                db.collection("users").doc(user.uid).get().then((doc) => {
                    if (doc.exists) {
                        document.getElementById("profile-info").innerHTML = `ইমেইল: ${user.email} <br> ব্যালেন্স: ${doc.data().balance} TK`;
                    } else {
                        db.collection("users").doc(user.uid).set({ email: user.email, balance: 0 });
                    }
                });
            }
        });
    </script>
</body>
</html>

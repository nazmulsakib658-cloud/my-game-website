<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>গেমিং পোর্টাল</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        .game-card { border: 1px solid #ccc; padding: 15px; margin: 15px auto; border-radius: 8px; max-width: 300px; }
        button { padding: 10px; margin: 5px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>আমার গেমিং পোর্টাল</h1>

    <div id="auth-container">
        <input type="email" id="email" placeholder="ইমেইল"><br>
        <input type="password" id="password" placeholder="পাসওয়ার্ড"><br>
        <button onclick="signUp()">সাইনআপ</button>
        <button onclick="logIn()">লগইন</button>
    </div>

    <div id="profile-section" style="display:none;">
        <h3>আপনার প্রোফাইল</h3>
        <div id="profile-info"></div>
        <button onclick="saveScore()">ব্যালেন্স আপডেট</button>
        <button onclick="logOut()">লগআউট</button>

        <div class="game-card">
            <p>Super Ace</p>
            <button onclick="playGame('Super Ace')">Play</button>
        </div>
        <div class="game-card">
            <p>Fortune Gems</p>
            <button onclick="playGame('Fortune Gems')">Play</button>
        </div>
    </div>

    <script>
        function playGame(gameName) {
            alert(gameName + " গেমটি এখন লোড হচ্ছে...");
        }

        // বাকি আপনার আগের ফাংশনগুলো (signUp, logIn, saveScore, logOut) এখানে বসান
        // নিশ্চিত করবেন যে এগুলো যেন অবশ্যই <script> ট্যাগের ভেতরে থাকে!
    </script>
</body>
</html>
